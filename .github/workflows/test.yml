name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly full network + source health (UTC Sunday midnight)
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Cancel superseded PR/push runs, but never cancel scheduled health checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  HOSTY_CI_LOG_DIR: ${{ github.workspace }}/ci-logs

jobs:
  lint:
    if: github.event_name != 'push'
    name: Lint (POSIX sh)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -o Dpkg::Use-Pty=0 install -y \
            shellcheck shfmt dash

      - name: Format
        run: shfmt -i 4 -ci -sr -d hosty.sh install.sh ci/*.sh ci/smoke-core

      - name: ShellCheck (POSIX sh)
        run: shellcheck --shell=sh hosty.sh install.sh ci/lib.sh ci/smoke.sh ci/smoke-core ci/check-sources.sh ci/coverage.sh ci/test-coverage.sh ci/test-hosts-write.sh

      - name: dash syntax and runtime
        run: |
          for script in hosty.sh install.sh ci/lib.sh ci/smoke.sh ci/smoke-core ci/check-sources.sh ci/coverage.sh ci/test-coverage.sh ci/test-hosts-write.sh; do
            dash -n "$script"
          done
          dash hosty.sh --help >/dev/null
          dash hosty.sh --version >/dev/null

      - name: Test coverage validation and hosts-file writes
        run: |
          ./ci/test-coverage.sh
          ./ci/test-hosts-write.sh

  smoke:
    if: github.event_name != 'push'
    name: Smoke (${{ matrix.name }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runner: ubuntu-26.04
          - name: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -o Dpkg::Use-Pty=0 install -y \
            expect dash cron

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install expect

      - name: Run offline smoke suite
        run: |
          chmod +x hosty.sh install.sh ci/smoke.sh ci/check-sources.sh ci/expect/*.exp
          ./ci/smoke.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ matrix.name }}
          path: ci-logs/
          if-no-files-found: ignore

  coverage:
    if: github.event_name != 'push'
    name: Coverage (kcov)
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -o Dpkg::Use-Pty=0 install -y \
            kcov expect dash cron python3

      - name: Measure offline smoke coverage
        run: |
          chmod +x hosty.sh install.sh ci/smoke.sh ci/coverage.sh ci/expect/*.exp
          sudo env HOSTY_CI_LOG_DIR="$HOSTY_CI_LOG_DIR" ./ci/coverage.sh

      - name: Make coverage artifacts readable
        if: always()
        run: |
          for directory in coverage ci-logs; do
            if [ -d "$directory" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$directory"
            fi
          done

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            ci-logs/
          if-no-files-found: ignore

  smoke-alpine:
    if: github.event_name != 'push'
    name: Smoke (Alpine / BusyBox ash)
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container: alpine:3.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: apk add --no-cache curl expect cronie coreutils dash

      - name: Run offline smoke suite
        run: |
          chmod +x hosty.sh install.sh ci/smoke.sh ci/check-sources.sh ci/expect/*.exp
          ./ci/smoke.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-alpine
          path: ci-logs/
          if-no-files-found: ignore

  smoke-openbsd:
    if: github.event_name != 'push'
    name: Smoke (OpenBSD 7.9)
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run offline smoke suite in OpenBSD
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: "7.9"
          usesh: true
          prepare: |
            pkg_add curl expect
            useradd -m hostyci
            printf '%s\n' \
              'permit nopass root as hostyci' \
              'permit nopass hostyci as root' > /etc/doas.conf
          run: |
            chmod +x hosty.sh install.sh ci/smoke.sh ci/check-sources.sh ci/expect/*.exp
            ./ci/smoke.sh

            cp hosty.sh install.sh /tmp/
            chmod 755 /tmp/hosty.sh /tmp/install.sh
            doas -u hostyci env HOSTY_URL=/tmp/hosty.sh sh /tmp/install.sh </dev/null
            test "$(/usr/local/bin/hosty -v)" = "$(./hosty.sh -v)"
            rm -f /usr/local/bin/hosty /tmp/hosty.sh /tmp/install.sh

  network:
    name: Network full run
    needs: lint
    # Full remote source downloads: main pushes, weekly schedule, manual runs.
    # Main intentionally skips lint, which already ran on the pull request.
    if: >
      !cancelled() &&
      (needs.lint.result == 'success' ||
       (github.event_name == 'push' && needs.lint.result == 'skipped')) &&
      (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -o Dpkg::Use-Pty=0 install -y \
            expect dash cron

      - name: Run smoke with network + production install
        env:
          RUN_NETWORK: "1"
          RUN_PRODUCTION_INSTALL: "1"
        run: |
          chmod +x hosty.sh install.sh ci/smoke.sh ci/expect/*.exp
          ./ci/smoke.sh

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-network
          path: ci-logs/
          if-no-files-found: ignore

  source-health:
    name: Source URL health
    needs: lint
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source URLs
        run: |
          chmod +x ci/check-sources.sh
          ./ci/check-sources.sh

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-health-report
          path: ci-logs/
          if-no-files-found: ignore

  preserve-state:
    if: github.event_name == 'pull_request'
    name: Preserve existing Hosty state
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -o Dpkg::Use-Pty=0 install -y \
            expect dash cron

      - name: Test installer from a noexec temporary directory
        run: |
          noexec_dir=$(mktemp -d)
          cleanup() {
            sudo rm -f /usr/local/bin/hosty
            sudo umount "$noexec_dir" 2>/dev/null || true
            rmdir "$noexec_dir"
          }
          trap cleanup EXIT

          sudo mount -t tmpfs -o noexec,size=1m tmpfs "$noexec_dir"
          sudo env TMPDIR="$noexec_dir" HOSTY_URL="$PWD/hosty.sh" sh ./install.sh </dev/null
          test "$(sudo /usr/local/bin/hosty -v)" = "$(./hosty.sh -v)"

      - name: Test installer protocol restrictions
        run: |
          fake_bin=$(mktemp -d)
          cleanup() {
            sudo rm -f /usr/local/bin/hosty
            rm -rf "$fake_bin"
          }
          trap cleanup EXIT

          cat > "$fake_bin/curl" <<'EOF_CURL'
          #!/bin/sh
          output=""
          saw_proto=0
          saw_proto_redir=0

          while [ "$#" -gt 0 ]; do
              case $1 in
                  --proto)
                      shift
                      [ "$1" = '=https,file' ] || exit 91
                      saw_proto=1
                      ;;
                  --proto-redir)
                      shift
                      [ "$1" = '=https' ] || exit 92
                      saw_proto_redir=1
                      ;;
                  -o)
                      shift
                      output=$1
                      ;;
              esac
              shift
          done

          [ "$saw_proto" -eq 1 ] && [ "$saw_proto_redir" -eq 1 ] && [ -n "$output" ] || exit 93
          cp "$HOSTY_FIXTURE" "$output"
          EOF_CURL
          chmod +x "$fake_bin/curl"

          sudo env \
            PATH="$fake_bin:$PATH" \
            HOSTY_FIXTURE="$PWD/hosty.sh" \
            HOSTY_URL=https://example.invalid/hosty.sh \
            sh ./install.sh </dev/null
          test "$(sudo /usr/local/bin/hosty -v)" = "$(./hosty.sh -v)"

      - name: Seed existing state
        run: |
          sudo cp /etc/hosts /tmp/hosty-hosts.before
          sudo mkdir -p /etc/hosty /etc/cron.daily
          printf '%s\n' preserve-me | sudo tee /etc/hosty/preserved >/dev/null
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" preserve-me' | sudo tee /usr/local/bin/hosty >/dev/null
          sudo chmod 755 /usr/local/bin/hosty
          printf '%s\n' '#!/bin/sh' 'printf "%s\n" preserve-cron' | sudo tee /etc/cron.daily/hosty >/dev/null
          sudo chmod 700 /etc/cron.daily/hosty
          printf '%s\n' '17 3 * * * echo preserve-me # hosty-ci-preserve' | sudo crontab -

      - name: Run smoke suite
        run: |
          chmod +x hosty.sh install.sh ci/smoke.sh ci/check-sources.sh ci/expect/*.exp
          mkdir -p ci-logs
          if ! ./ci/smoke.sh > ci-logs/smoke-state.out 2>&1; then
            cat ci-logs/smoke-state.out
            exit 1
          fi

      - name: Upload CI logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-state-logs
          path: ci-logs/
          if-no-files-found: ignore

      - name: Verify restored state
        run: |
          sudo cmp /tmp/hosty-hosts.before /etc/hosts
          test "$(stat -c '%a' /etc/hosts)" = 644
          test "$(sudo cat /etc/hosty/preserved)" = preserve-me
          test "$(sudo /usr/local/bin/hosty)" = preserve-me
          test "$(sudo /etc/cron.daily/hosty)" = preserve-cron
          test "$(stat -c '%a' /etc/cron.daily/hosty)" = 700
          sudo crontab -l | grep -qF -e '# hosty-ci-preserve'

      - name: Test hosts metadata restoration
        run: |
          mode_core=$(mktemp)
          cleanup() {
            sudo chmod 644 /etc/hosts
            rm -f "$mode_core"
          }
          trap cleanup EXIT

          cat > "$mode_core" <<'EOF_CORE'
          #!/bin/sh
          sudo chmod 644 /etc/hosts
          EOF_CORE

          sudo chmod 600 /etc/hosts
          HOSTY_SMOKE_CORE="$mode_core" ./ci/smoke.sh
          test "$(stat -c '%a' /etc/hosts)" = 600

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - lint
      - smoke
      - coverage
      - smoke-alpine
      - smoke-openbsd
      - source-health
      - preserve-state
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. != "failure" and . != "cancelled")' <<< "$RESULTS"
